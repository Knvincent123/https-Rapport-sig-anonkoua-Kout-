 im.onclick=()=>{if(FS&&!fh){msg("Liez d'abord le fichier de données de la clé USB");return}imf.click()};
 imf.onchange=async()=>{const fl=imf.files[0];if(!fl)return;
  try{const j=JSON.parse(await fl.text()),R=j.rapports||j;let c=0;
   for(const k in R){if(/^\d{4}-\d{2}$/.test(k)&&R[k]&&R[k].v){DATA[k]=R[k];c++;if(db){try{await db.collection("rapports").doc(k).set(R[k])}catch(e){}}}}
   if(!db){if(FS)await fsWrite();else{try{localStorage.setItem("sig6",JSON.stringify(DATA))}catch(e){}}}
   msg(c+" mois importé(s) ✔");fsBar();draw()}catch(e){msg("Import impossible (fichier invalide ou clé absente)")}
  imf.value=""};
})();
boot();
</script></body></html>
